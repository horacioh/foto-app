name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  wasm:
    name: WASM (wasm-pack build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: cargo install wasm-pack --locked
      - run: bun install --frozen-lockfile
      - run: bun run wasm:build
      - uses: actions/upload-artifact@v4
        with:
          name: core-wasm
          path: packages/core-wasm/pkg
          retention-days: 7

  ts:
    name: TypeScript (lint, typecheck, test, web export)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: core-wasm
          path: packages/core-wasm/pkg
      - run: bun run --filter @photos/core-wasm copy:app
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - name: Export web app
        working-directory: apps/app
        run: CI=1 bunx expo export --platform web --output-dir dist
        env:
          EXPO_NO_TELEMETRY: '1'
