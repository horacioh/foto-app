[workspace]
resolver = "2"
members = [
  "crates/protocol",
  "crates/core",
  "crates/core-uniffi",
  "crates/core-wasm",
  "crates/server",
  "crates/storage-node",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/horacioh/photos"
rust-version = "1.85"

[workspace.dependencies]
photos-protocol = { path = "crates/protocol" }
photos-core = { path = "crates/core" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.26", features = ["v4", "serde"] }
bytes = "1.12"
tokio = { version = "1.53", default-features = false }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace", "cors"] }
tower = "0.5"
clap = { version = "4.6", features = ["derive", "env"] }
chacha20poly1305 = "0.10"
blake3 = "1.8"
rand = "0.8"
uniffi = "0.32"
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
tempfile = "3"
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
