[package]
name = "photos-core-wasm"
description = "wasm-bindgen surface of photos-core for the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
photos-core = { workspace = true }
wasm-bindgen = { workspace = true }
serde_json = { workspace = true }

# Browser entropy for XChaCha20 keys and UUIDs.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
uuid = { workspace = true, features = ["js"] }

# wasm-pack's bundled wasm-opt predates the bulk-memory / nontrapping-fptoint
# features that current rustc emits by default.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
